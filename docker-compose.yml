version: "3.4"
services:
  postgres:
    image: postgres:12.2
    environment:
      - POSTGRES_PASSWORD=root
      - POSTGRES_USER=root
    ports:
      - "5432:5432"
    volumes:
      - ./db/data:/var/lib/postgresql/data
      - ./db/config:/docker-entrypoint-initdb.d
      - ./db/backup:/backup
  adminer:
    image: adminer
    ports:
      - 8080:8080